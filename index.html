<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="style.css">

<body>
<div class="app">
  <header>
    <button class="pill">× إغلاق</button>
    <div class="head-actions"><button>⌄</button><button>•••</button></div>
  </header>

  <div class="reply">🔗 الإحالة <span class="stars">100 ★</span></div>

  <main>
    <section class="profile card">
      <button class="gear">⚙</button>
      <div class="avatar"><img src="profile.jpg" alt="Profile"></div>
      <h1>𝗠𝗥/ 𝙈𝙊𝙃𝘼𝙈𝙀𝘿 𝙎𝘼𝘿𝙀𝙆 <span class="verified">✓</span></h1>
      <div class="online"><b>1</b> متصل</div>
    </section>

    <section class="card withdrawal">
      <div class="warning">⚠️</div>
      <h2>عذراً عملية السحب غير مكتملة</h2>
      <p>هذا العرض <strong>تجريبي</strong> — لا توجد عملية دفع حقيقية.</p>
      <div class="notice">تنبيه: هذه الصفحة نموذج واجهة فقط ولا تطلب تحويل أموال أو بيانات دفع حقيقية.</div>

      <label>اسم العميل</label>
      <div class="field">𝗠𝗥/ 𝙈𝙊𝙃𝘼𝙈𝙀𝘿 𝙎𝘼𝘿𝙀𝙆 <span>♙</span></div>

      <label>رقم العميل</label>
      <div class="field">01000000000 <span>♧</span></div>

      <label>رسوم الباقة</label>
      <div class="field">0 ج.م <span>▣</span></div>

      <label>رقم الهاتف الذي سيتم السحب إليه</label>
      <div class="input-wrap"><span>☎</span><input id="phone" inputmode="numeric" placeholder="ادخل الرقم"></div>

      <button class="done" id="done">تم</button>
    </section>
  </main>

  <nav>
    <button class="active">⌂<small>الرئيسية</small></button>
    <button>♧<small>قسم الوكيل</small></button>
    <button>▣<small>قسم السحب</small></button>
    <button>♧<small>قسم دعم</small></button>
    <button>▦<small>السجل</small></button>
  </nav>
</div>
<script src="script.js"></script>
</body>
</html>
